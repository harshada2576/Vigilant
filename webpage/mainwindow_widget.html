<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherLink Messenger</title>
    <style>
        /* Dark theme palette */
        :root {
            --background: #121212;
            --primary-text: #EAEAEA;
            --secondary-text: #9E9E9E;
            --ui-borders: #2A2A2A;
            --accent: #BB86FC;
            --shadow: rgba(0,0,0,0.20);
            --chat-bg: #571452;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--primary-text);
            font-size: 14px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Window Styles */
        #main-window {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: row;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 200px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--background);
            border-right: 1px solid var(--ui-borders);
        }

        #profile-label {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid var(--ui-borders);
        }

        #sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        /* Splitter Layout */
        #splitter {
            display: flex;
            flex: 1;
            height: 100%;
        }

        /* Chat List Styles */
        #chat-list {
            width: 280px;
            max-width: 280px;
            border-right: 1px solid var(--ui-borders);
            background-color: var(--background);
            color: var(--primary-text);
            overflow-y: auto;
        }

        .chat-list-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--ui-borders);
            transition: background-color 0.2s;
        }

        .chat-list-item:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }

        .chat-list-item.selected {
            background-color: var(--accent);
            color: white;
        }

        /* Chat Area Styles */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        #chat-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--ui-borders);
        }

        #chat-display {
            flex: 1;
            background-color: var(--chat-bg);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-sender {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message-time {
            color: #888;
            font-size: 10px;
            margin-left: 5px;
            float: right;
        }

        .message-content {
            margin-top: 4px;
        }

        .own-message {
            align-self: flex-end;
            background-color: rgba(41, 121, 255, 0.2);
            border: 1px solid rgba(41, 121, 255, 0.5);
        }

        .other-message {
            align-self: flex-start;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.3);
        }

        #input-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #message-input {
            flex: 1;
            background-color: var(--background);
            border: 1.5px solid var(--ui-borders);
            border-radius: 6px;
            padding: 12px;
            font-size: 15px;
            color: var(--primary-text);
        }

        #send-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 12px 24px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        #send-button:hover:not(:disabled) {
            background-color: var(--primary-text);
            color: var(--background);
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* New Chat Dialog Styles */
        #new-chat-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 20px;
            background-color: var(--background);
            border: 1px solid var(--ui-borders);
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 12px var(--shadow);
        }

        /* Settings Dialog Styles */
        #settings-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            padding: 20px;
            background-color: var(--background);
            border: 1px solid var(--ui-borders);
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .dialog-row {
            margin-bottom: 15px;
        }

        .dialog-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .dialog-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .dialog-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }

        .visible {
            display: flex !important;
        }

        .block-visible {
            display: block !important;
        }
    </style>
</head>
<body>
    <!-- Main Window -->
    <div id="main-window" class="visible">
        <!-- Sidebar -->
        <div id="sidebar">
            <div id="profile-label">User: placeholder</div>
            <div id="sidebar-buttons">
                <button id="new-chat-button" class="sidebar-button">New Chat</button>
                <button id="settings-button" class="sidebar-button">Settings</button>
                <button id="logout-button" class="sidebar-button">Logout</button>
            </div>
        </div>

        <!-- Splitter -->
        <div id="splitter">
            <!-- Chat List -->
            <div id="chat-list">
                <div class="chat-list-item">General Chat</div>
                <div class="chat-list-item">John Doe</div>
                <div class="chat-list-item">Project Team</div>
            </div>

            <!-- Chat Area -->
            <div id="chat-area">
                <div id="chat-header">Select a chat</div>
                <div id="chat-display">
                    <div class="message other-message">
                        <div class="message-sender">User 2</div>
                        <div class="message-content">Hello there!</div>
                        <span class="message-time">[10:30 AM]</span>
                    </div>
                    <div class="message own-message">
                        <div class="message-sender">You</div>
                        <div class="message-content">Hi! How are you doing?</div>
                        <span class="message-time">[10:31 AM]</span>
                    </div>
                </div>
                <div id="input-area">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button id="send-button" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Dialog -->
    <div id="new-chat-dialog" class="hidden">
        <div class="dialog-row" style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="group-checkbox" checked style="margin-right: 8px;">
            <label for="group-checkbox" style="margin: 0;">Group Chat</label>
        </div>
        <div class="dialog-row" id="chat-name-row">
            <label for="chat-name-input" style="width: 100px;">Chat Name:</label>
            <input type="text" id="chat-name-input" placeholder="Enter chat name" style="flex: 1;">
        </div>
        <div class="dialog-row">
            <label for="participants-input" style="width: 100px;">Participants:</label>
            <input type="text" id="participants-input" placeholder="username1, username2" style="flex: 1;">
        </div>
        <div id="chat-dialog-error" style="color: #ff5555; min-height: 18px; text-align: center; font-size: 13px;"></div>
        <div class="dialog-buttons" style="justify-content: flex-end; gap: 10px;">
            <button id="confirm-chat-button" class="dialog-button" style="min-width: 90px;">Create</button>
            <button id="cancel-chat-button" class="dialog-button" style="min-width: 90px; background: #444;">Cancel</button>
        </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settings-dialog" class="hidden">
        <div class="dialog-row">
            <h3>Settings</h3>
        </div>
        <div class="dialog-row">
            <label for="theme-select">Theme:</label>
            <select id="theme-select">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="medium">Medium</option>
            </select>
        </div>
        <div class="dialog-row">
            <label for="display-name-input">Display Name:</label>
            <input type="text" id="display-name-input" placeholder="Enter display name">
        </div>
        <div class="dialog-buttons">
            <button id="save-settings-button" class="dialog-button">Save</button>
            <button id="cancel-settings-button" class="dialog-button">Cancel</button>
        </div>
    </div>

    <script>
        // Application state
        const appState = {
            currentUser: "placeholder",
            currentUserId: null,
            currentChatId: null,
            conversations: [],
            messages: {}
        };

        // Helper: get token from localStorage
        function getToken() {
            return localStorage.getItem('cipherlink_token');
        }

        // Fetch current user info from backend
        async function fetchCurrentUser() {
            const token = getToken();
            if (!token) return null;
            try {
                const response = await fetch('http://localhost:8000/me', {
                    headers: { 'token': token }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        return data;
                    }
                }
            } catch (e) {}
            return null;
        }

        // Fetch conversations from backend
        async function fetchConversations() {
            const token = getToken();
            if (!token) return [];
            try {
                const response = await fetch('http://localhost:8000/get_conversation', {
                    headers: { 'token': token }
                });
                if (response.ok) {
                    return await response.json();
                } else {
                    return [];
                }
            } catch (e) {
                return [];
            }
        }

        // DOM Elements
        const mainWindow = document.getElementById('main-window');
        const newChatDialog = document.getElementById('new-chat-dialog');
        const settingsDialog = document.getElementById('settings-dialog');

        // Main Window Elements
        const profileLabel = document.getElementById('profile-label');
        const chatList = document.getElementById('chat-list');
        const chatHeader = document.getElementById('chat-header');
        const chatDisplay = document.getElementById('chat-display');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const newChatButton = document.getElementById('new-chat-button');
        const settingsButton = document.getElementById('settings-button');
        const logoutButton = document.getElementById('logout-button');

        // New Chat Dialog Elements
        const groupCheckbox = document.getElementById('group-checkbox');
        const chatNameRow = document.getElementById('chat-name-row');
        const chatNameInput = document.getElementById('chat-name-input');
        const participantsInput = document.getElementById('participants-input');
        const confirmChatButton = document.getElementById('confirm-chat-button');
        const cancelChatButton = document.getElementById('cancel-chat-button');

        // Settings Dialog Elements
        const themeSelect = document.getElementById('theme-select');
        const displayNameInput = document.getElementById('display-name-input');
        const saveSettingsButton = document.getElementById('save-settings-button');
        const cancelSettingsButton = document.getElementById('cancel-settings-button');

        // Initialize the application
        async function init() {
            setupEventListeners();
            // Fetch user info from backend
            const userInfo = await fetchCurrentUser();
            if (userInfo && userInfo.user_id) {
                appState.currentUserId = userInfo.user_id;
                appState.currentUser = userInfo.user_id;
            } else {
                appState.currentUserId = null;
                appState.currentUser = 'Unknown';
            }
            // Fetch conversations from backend
            const conversations = await fetchConversations();
            if (Array.isArray(conversations)) {
                appState.conversations = conversations;
            } else if (conversations && conversations.length) {
                appState.conversations = conversations;
            } else {
                appState.conversations = [];
            }
            populateChatList();
            updateProfileLabel();
        }

        // Set up all event listeners
        function setupEventListeners() {
            // Main window buttons
            newChatButton.addEventListener('click', showNewChatDialog);
            settingsButton.addEventListener('click', showSettingsDialog);
            logoutButton.addEventListener('click', handleLogout);
            
            // Message input
            messageInput.addEventListener('input', toggleSendButton);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            sendButton.addEventListener('click', sendMessage);

            // New chat dialog
            groupCheckbox.addEventListener('change', toggleGroupFields);
            confirmChatButton.addEventListener('click', createNewChat);
            cancelChatButton.addEventListener('click', hideNewChatDialog);

            // Settings dialog
            saveSettingsButton.addEventListener('click', saveSettings);
            cancelSettingsButton.addEventListener('click', hideSettingsDialog);

            // Chat list items
            document.querySelectorAll('.chat-list-item').forEach(item => {
                item.addEventListener('click', () => loadChat(item));
            });
        }

        // Update profile label with current user
        function updateProfileLabel() {
            profileLabel.textContent = `User: ${appState.currentUser}`;
        }

        // Populate chat list
        function populateChatList() {
            chatList.innerHTML = '';
            appState.conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'chat-list-item';
                item.dataset.id = conv.id;

                // Avatar (first letter or icon)
                const avatar = document.createElement('span');
                avatar.className = 'chat-avatar';
                avatar.textContent = (conv.name && conv.name.length > 0) ? conv.name[0].toUpperCase() : 'C';
                avatar.style = 'display:inline-block;width:32px;height:32px;background:#BB86FC;color:#fff;border-radius:50%;text-align:center;line-height:32px;font-weight:bold;margin-right:12px;font-size:16px;vertical-align:middle;';

                // Chat name
                const nameSpan = document.createElement('span');
                nameSpan.textContent = conv.name;
                nameSpan.style = 'vertical-align:middle;font-size:15px;font-weight:500;';

                // Unread count (if available)
                let unread = conv.unread_count || 0;
                let unreadBadge = null;
                if (unread > 0) {
                    unreadBadge = document.createElement('span');
                    unreadBadge.textContent = unread;
                    unreadBadge.className = 'unread-badge';
                    unreadBadge.style = 'background:#ff5555;color:#fff;border-radius:12px;padding:2px 8px;font-size:12px;margin-left:8px;vertical-align:middle;';
                }

                item.appendChild(avatar);
                item.appendChild(nameSpan);
                if (unreadBadge) item.appendChild(unreadBadge);

                item.addEventListener('click', () => {
                    document.querySelectorAll('.chat-list-item').forEach(el => {
                        el.classList.remove('selected');
                    });
                    item.classList.add('selected');
                    loadChat(item);
                });

                chatList.appendChild(item);
            });
        }

        // Load a specific chat
        async function loadChat(item) {
            const chatId = parseInt(item.dataset.id);
            appState.currentChatId = chatId;
            const conversation = appState.conversations.find(conv => conv.id === chatId);
            chatHeader.textContent = `Chat: ${conversation.name}`;
            chatDisplay.innerHTML = '';

            // Fetch messages from backend
            const token = getToken();
            let messages = [];
            if (token) {
                try {
                    const response = await fetch(`${API_BASE}/get_messages?conversation_id=${chatId}`, {
                        headers: { 'token': token }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success && Array.isArray(data.messages)) {
                            messages = data.messages;
                        }
                    }
                } catch (e) {}
            }
            appState.messages[chatId] = messages;

            if (messages.length) {
                messages.forEach(msg => {
                    const isOwnMessage = (msg.sender_id === appState.currentUserId);
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${isOwnMessage ? 'own-message' : 'other-message'}`;
                    // Format timestamp (HH:MM AM/PM)
                    let time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                    const sender = isOwnMessage ? "You" : (msg.sender_display_name || `User ${msg.sender_id}`);
                    messageDiv.innerHTML = `
                        <div class="message-sender" style="font-weight:bold;${isOwnMessage ? 'color:#2979FF;' : ''}">${sender}</div>
                        <div class="message-content" style="margin-top:2px;">${msg.content}</div>
                        <span class="message-time" style="color:#888;font-size:10px;float:right;">[${time}]</span>
                    `;
                    chatDisplay.appendChild(messageDiv);
                });
            }
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            messageInput.disabled = false;
            toggleSendButton();

            // Real-time polling for new messages (every 3s)
            if (window._chatPollInterval) clearInterval(window._chatPollInterval);
            window._chatPollInterval = setInterval(() => {
                if (appState.currentChatId === chatId) loadChat(item);
            }, 3000);
        }

        // Send a message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !appState.currentChatId) return;
            const token = getToken();
            if (!token) return;
            try {
                const response = await fetch(`${API_BASE}/send_message?conversation_id=${appState.currentChatId}&content=${encodeURIComponent(message)}`, {
                    method: 'POST',
                    headers: { 'token': token }
                });
                if (response.ok) {
                    // Clear input and reload chat
                    messageInput.value = '';
                    toggleSendButton();
                    await loadChat(document.querySelector(`.chat-list-item[data-id="${appState.currentChatId}"]`));
                } else {
                    showNotification('Failed to send message.', 'error');
                }
            } catch (e) {
                showNotification('Network error: ' + e.message, 'error');
            }
        }

        // Toggle send button based on input
        function toggleSendButton() {
            sendButton.disabled = !messageInput.value.trim() || !appState.currentChatId;
        }

        // Show new chat dialog
        function showNewChatDialog() {
            newChatDialog.style.display = 'block';
            toggleGroupFields();
            setTimeout(() => {
                if (groupCheckbox.checked) chatNameInput.focus();
                else participantsInput.focus();
            }, 100);
        }

        // Hide new chat dialog
        function hideNewChatDialog() {
            newChatDialog.style.display = 'none';
            chatNameInput.value = '';
            participantsInput.value = '';
            groupCheckbox.checked = true;
        }

        // Show settings dialog
        function showSettingsDialog() {
            displayNameInput.value = appState.currentUser;
            settingsDialog.style.display = 'block';
        }

        // Hide settings dialog
        function hideSettingsDialog() {
            settingsDialog.style.display = 'none';
        }

        // Toggle group chat fields
        function toggleGroupFields() {
            const isGroup = groupCheckbox.checked;
            chatNameRow.style.display = isGroup ? 'block' : 'none';
        }

        // Create new chat
        async function createNewChat() {
            const isGroup = groupCheckbox.checked;
            const chatName = chatNameInput.value.trim();
            const participantsText = participantsInput.value.trim();
            const errorDiv = document.getElementById('chat-dialog-error');
            errorDiv.textContent = '';
            if (!participantsText) {
                errorDiv.textContent = 'Please enter at least one participant username.';
                return;
            }
            const participants = participantsText.split(',').map(p => p.trim()).filter(p => p);
            if (participants.length === 0) {
                errorDiv.textContent = 'Please enter at least one valid participant username.';
                return;
            }
            if (isGroup && !chatName) {
                errorDiv.textContent = 'Please enter a chat name for group chats.';
                return;
            }
            // Call backend API to create conversation
            const token = getToken();
            try {
                const response = await fetch(`${API_BASE}/create_conversation`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': token
                    },
                    body: JSON.stringify({
                        user_names: participants,
                        conversation_name: isGroup ? chatName : null,
                        is_group: isGroup
                    })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    // Refresh chat list from backend
                    const conversations = await fetchConversations();
                    appState.conversations = conversations;
                    populateChatList();
                    hideNewChatDialog();
                    setTimeout(() => {
                        // Try to select the new chat
                        const newChatItem = document.querySelector(`.chat-list-item[data-id="${data.conversation_id || ''}"]`);
                        if (newChatItem) {
                            newChatItem.click();
                        }
                    }, 100);
                    // Show success feedback
                    errorDiv.style.color = '#44cc44';
                    errorDiv.textContent = 'Chat created successfully!';
                    setTimeout(() => { errorDiv.textContent = ''; errorDiv.style.color = '#ff5555'; }, 1200);
                } else {
                    errorDiv.textContent = data.message || 'Failed to create chat.';
                }
            } catch (e) {
                errorDiv.textContent = 'Network error: ' + e.message;
            }
        }

        // Save settings
        async function saveSettings() {
            const newDisplayName = displayNameInput.value.trim();
            const theme = themeSelect.value;
            let success = true;
            let msg = '';
            // Persist display name via backend if possible
            if (newDisplayName) {
                // If you have a backend endpoint for updating display name, call it here
                // Example (uncomment and adjust if endpoint exists):
                // const token = getToken();
                // try {
                //     const response = await fetch(`${API_BASE}/update_display_name`, {
                //         method: 'POST',
                //         headers: { 'Content-Type': 'application/json', 'token': token },
                //         body: JSON.stringify({ display_name: newDisplayName })
                //     });
                //     if (!response.ok) { success = false; msg = 'Failed to update display name.'; }
                // } catch (e) { success = false; msg = 'Network error: ' + e.message; }
                appState.currentUser = newDisplayName;
                updateProfileLabel();
            }
            // Apply theme (update CSS variables)
            document.documentElement.setAttribute('data-theme', theme);
            // Optionally, update CSS variables here for more advanced theming
            // Show styled notification instead of alert
            showNotification(success ? 'Settings saved successfully!' : msg, success ? 'success' : 'error');
            if (success) hideSettingsDialog();
        // Styled notification for errors/success
        function showNotification(message, type) {
            let notif = document.getElementById('styled-notification');
            if (!notif) {
                notif = document.createElement('div');
                notif.id = 'styled-notification';
                notif.style = 'position:fixed;top:30px;right:30px;z-index:2000;padding:16px 28px;border-radius:8px;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.15);min-width:200px;text-align:center;';
                document.body.appendChild(notif);
            }
            notif.textContent = message;
            notif.style.background = type === 'success' ? '#44cc44' : '#ff5555';
            notif.style.color = '#fff';
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 1800);
        }
        }

        // Handle logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                // Clear application state
                appState.currentChatId = null;
                // Reset UI
                chatHeader.textContent = 'Select a chat';
                chatDisplay.innerHTML = '';
                messageInput.value = '';
                sendButton.disabled = true;
                // Deselect any selected chat
                document.querySelectorAll('.chat-list-item').forEach(item => {
                    item.classList.remove('selected');
                });
                showNotification('Logged out successfully!', 'success');
            }
        }

        // Initialize the application
