<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherLink Messenger</title>
    <style>
        /* Dark theme palette (default) */
        :root {
            --background: #121212;
            --primary-text: #EAEAEA;
            --secondary-text: #9E9E9E;
            --ui-borders: #2A2A2A;
            --accent: #BB86FC;
            --shadow: rgba(0,0,0,0.20);
            --chat-bg: #571452;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--primary-text);
            font-size: 14px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Loading Widget Styles */
        #loading-widget {
            width: 450px;
            min-height: 200px;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.5s ease;
        }

        #loading-label {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
        }

        #loading-progress {
            width: 100%;
            height: 24px;
            border: 1px solid var(--ui-borders);
            border-radius: 5px;
            overflow: hidden;
            background-color: var(--background);
        }

        #loading-progress-bar {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.1s ease;
        }

        /* Login Widget Styles */
        #login-widget {
            width: 400px;
            min-height: 320px;
            padding: 30px 40px;
            display: none;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.5s ease;
        }

        .login-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-row label {
            text-align: right;
            width: 30%;
            color: var(--primary-text);
        }

        .form-row input {
            width: 70%;
            background-color: var(--background);
            border: 1.5px solid var(--ui-borders);
            border-radius: 6px;
            padding: 10px;
            font-size: 15px;
            color: var(--primary-text);
        }

        .login-button, .register-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 10px 20px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-button:hover, .register-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        .login-button:active, .register-button:active {
            background-color: var(--accent);
            color: white;
        }

        .login-button {
            height: 40px;
        }

        .register-button {
            height: 30px;
        }

        #login-status {
            text-align: center;
            min-height: 20px;
            color: var(--accent);
        }

        /* Main Window Styles */
        #main-window {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: row;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 200px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--background);
            border-right: 1px solid var(--ui-borders);
        }

        #profile-label {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid var(--ui-borders);
        }

        #sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        /* Splitter Layout */
        #splitter {
            display: flex;
            flex: 1;
            height: 100%;
        }

        /* Chat List Styles */
        #chat-list {
            width: 280px;
            max-width: 280px;
            border-right: 1px solid var(--ui-borders);
            background-color: var(--background);
            color: var(--primary-text);
            overflow-y: auto;
        }

        .chat-list-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--ui-borders);
            transition: background-color 0.2s;
        }

        .chat-list-item:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }

        .chat-list-item.selected {
            background-color: var(--accent);
            color: white;
        }

        /* Chat Area Styles */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        #chat-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--ui-borders);
        }

        #chat-display {
            flex: 1;
            background-color: var(--chat-bg);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-sender {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message-time {
            color: #888;
            font-size: 10px;
            margin-left: 5px;
            float: right;
        }

        .message-content {
            margin-top: 4px;
        }

        .own-message {
            align-self: flex-end;
            background-color: rgba(41, 121, 255, 0.2);
            border: 1px solid rgba(41, 121, 255, 0.5);
        }

        .other-message {
            align-self: flex-start;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.3);
        }

        #input-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #message-input {
            flex: 1;
            background-color: var(--background);
            border: 1.5px solid var(--ui-borders);
            border-radius: 6px;
            padding: 12px;
            font-size: 15px;
            color: var(--primary-text);
        }

        #send-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 12px 24px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        #send-button:hover:not(:disabled) {
            background-color: var(--primary-text);
            color: var(--background);
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* New Chat Dialog Styles */
        #new-chat-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 20px;
            background-color: var(--background);
            border: 1px solid var(--ui-borders);
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 12px var(--shadow);
        }

        /* Settings Dialog Styles */
        #settings-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            padding: 20px;
            background-color: var(--background);
            border: 1px solid var(--ui-borders);
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .dialog-row {
            margin-bottom: 15px;
        }

        .dialog-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .dialog-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .dialog-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }

        .visible {
            display: flex !important;
        }

        .block-visible {
            display: block !important;
        }

        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- Loading Widget -->
    <div id="loading-widget" class="visible">
        <div id="loading-label">Connecting to server...</div>
        <div id="loading-progress">
            <div id="loading-progress-bar"></div>
        </div>
    </div>

    <!-- Login Widget -->
    <div id="login-widget" class="hidden">
        <div class="login-title">WELCOME BACK</div>
        <div class="form-row">
            <label for="username-input">Username:</label>
            <input type="text" id="username-input" placeholder="Enter Your Username">
        </div>
        <div class="form-row">
            <label for="password-input">Password:</label>
            <input type="password" id="password-input" placeholder="Enter Your Password">
        </div>
        <button id="login-button" class="login-button">Login</button>
        <button id="register-button" class="register-button">Register</button>
        <div id="login-status"></div>
    </div>

    <!-- Main Window -->
    <div id="main-window" class="hidden">
        <!-- Sidebar -->
        <div id="sidebar">
            <div id="profile-label">User: placeholder</div>
            <div id="sidebar-buttons">
                <button id="new-chat-button" class="sidebar-button">New Chat</button>
                <button id="settings-button" class="sidebar-button">Settings</button>
                <button id="logout-button" class="sidebar-button">Logout</button>
            </div>
        </div>

        <!-- Splitter -->
        <div id="splitter">
            <!-- Chat List -->
            <div id="chat-list"></div>

            <!-- Chat Area -->
            <div id="chat-area">
                <div id="chat-header">Select a chat</div>
                <div id="chat-display"></div>
                <div id="input-area">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button id="send-button" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Dialog -->
    <div id="new-chat-dialog" class="hidden">
        <div class="dialog-row">
            <input type="checkbox" id="group-checkbox" checked>
            <label for="group-checkbox">Group Chat</label>
        </div>
        <div class="dialog-row" id="chat-name-row">
            <label for="chat-name-input">Chat Name:</label>
            <input type="text" id="chat-name-input" placeholder="Enter chat name">
        </div>
        <div class="dialog-row">
            <label for="participants-input">Usernames (comma separated):</label>
            <input type="text" id="participants-input" placeholder="username1, username2">
        </div>
        <div class="dialog-buttons">
            <button id="confirm-chat-button" class="dialog-button">Confirm</button>
            <button id="cancel-chat-button" class="dialog-button">Cancel</button>
        </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settings-dialog" class="hidden">
        <div class="dialog-row">
            <h3>Settings</h3>
        </div>
        <div class="dialog-row">
            <label for="theme-select">Theme:</label>
            <select id="theme-select">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="medium">Medium</option>
            </select>
        </div>
        <div class="dialog-row">
            <label for="auto-login">Auto-login:</label>
            <input type="checkbox" id="auto-login" checked>
        </div>
        <div class="dialog-buttons">
            <button id="save-settings-button" class="dialog-button">Save</button>
            <button id="cancel-settings-button" class="dialog-button">Cancel</button>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://localhost:8000';
        
        // Application state
        const appState = {
            currentView: 'loading',
            currentUser: null,
            currentToken: null,
            currentUserId: null,
            currentChatId: null,
            conversations: [],
            messages: {},
            loadingSteps: [
                "Connecting to server...",
                "Loading user data...",
                "Preparing interface...",
                "Finalizing setup...",
                "Done!"
            ],
            currentStep: 0,
            progressValue: 0
        };

        // DOM Elements
        const loadingWidget = document.getElementById('loading-widget');
        const loginWidget = document.getElementById('login-widget');
        const mainWindow = document.getElementById('main-window');
        const newChatDialog = document.getElementById('new-chat-dialog');
        const settingsDialog = document.getElementById('settings-dialog');

        // Loading Widget Elements
        const loadingLabel = document.getElementById('loading-label');
        const loadingProgressBar = document.getElementById('loading-progress-bar');

        // Login Widget Elements
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const loginButton = document.getElementById('login-button');
        const registerButton = document.getElementById('register-button');
        const loginStatus = document.getElementById('login-status');

        // Main Window Elements
        const profileLabel = document.getElementById('profile-label');
        const chatList = document.getElementById('chat-list');
        const chatHeader = document.getElementById('chat-header');
        const chatDisplay = document.getElementById('chat-display');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const newChatButton = document.getElementById('new-chat-button');
        const settingsButton = document.getElementById('settings-button');
        const logoutButton = document.getElementById('logout-button');

        // New Chat Dialog Elements
        const groupCheckbox = document.getElementById('group-checkbox');
        const chatNameRow = document.getElementById('chat-name-row');
        const chatNameInput = document.getElementById('chat-name-input');
        const participantsInput = document.getElementById('participants-input');
        const confirmChatButton = document.getElementById('confirm-chat-button');
        const cancelChatButton = document.getElementById('cancel-chat-button');

        // Settings Dialog Elements
        const themeSelect = document.getElementById('theme-select');
        const autoLoginCheckbox = document.getElementById('auto-login');
        const saveSettingsButton = document.getElementById('save-settings-button');
        const cancelSettingsButton = document.getElementById('cancel-settings-button');

        // API Helper Functions
        async function apiCall(endpoint, options = {}) {
            const url = `${API_BASE_URL}${endpoint}`;
            
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };

            if (appState.currentToken) {
                headers['token'] = appState.currentToken;
            }

            const config = {
                headers: headers,
                ...options
            };

            if (config.body && typeof config.body === 'object') {
                config.body = JSON.stringify(config.body);
            }

            try {
                console.log(`🔧 API Call: ${config.method || 'GET'} ${url}`, config.body ? JSON.parse(config.body) : '');
                
                const response = await fetch(url, config);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log(`✅ API Response:`, data);
                return data;
                
            } catch (error) {
                console.error('❌ API call failed:', error);
                throw error;
            }
        }

        // Get current user ID from token
        async function getCurrentUserId() {
            try {
                const result = await apiCall('/me');
                if (result && result.success) {
                    appState.currentUserId = result.user_id;
                    return result.user_id;
                }
            } catch (error) {
                console.error('Error getting user ID:', error);
            }
            return null;
        }

        // Initialize the application
        function init() {
            setupEventListeners();
            simulateLoading();
        }

        // Set up all event listeners
        function setupEventListeners() {
            // Login form
            loginButton.addEventListener('click', handleLogin);
            registerButton.addEventListener('click', handleRegister);
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            // Main window buttons - FIXED: Added proper event listeners
            newChatButton.addEventListener('click', showNewChatDialog);
            settingsButton.addEventListener('click', showSettingsDialog);
            logoutButton.addEventListener('click', handleLogout);
            
            // Message input
            messageInput.addEventListener('input', toggleSendButton);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            sendButton.addEventListener('click', sendMessage);

            // New chat dialog - FIXED: Correct button IDs
            groupCheckbox.addEventListener('change', toggleGroupFields);
            confirmChatButton.addEventListener('click', createNewChat);
            cancelChatButton.addEventListener('click', hideNewChatDialog);

            // Settings dialog - ADDED: Settings functionality
            saveSettingsButton.addEventListener('click', saveSettings);
            cancelSettingsButton.addEventListener('click', hideSettingsDialog);
        }

        // Simulate loading process
        function simulateLoading() {
            const totalSteps = appState.loadingSteps.length;
            const progressInterval = setInterval(() => {
                appState.progressValue += 1;
                loadingProgressBar.style.width = `${(appState.progressValue / (totalSteps * 20)) * 100}%`;
                
                const stepIndex = Math.floor(appState.progressValue / 20);
                if (stepIndex >= totalSteps) {
                    clearInterval(progressInterval);
                    loadingLabel.textContent = "Loading complete!";
                    
                    setTimeout(() => {
                        loadingWidget.classList.add('fade-out');
                        setTimeout(() => {
                            loadingWidget.classList.remove('visible');
                            loadingWidget.classList.add('hidden');
                            showLoginScreen();
                        }, 500);
                    }, 1000);
                    return;
                }
                
                if (stepIndex !== appState.currentStep) {
                    appState.currentStep = stepIndex;
                    loadingLabel.textContent = appState.loadingSteps[appState.currentStep];
                }
            }, 100);
        }

        // Show login screen
        function showLoginScreen() {
            loginWidget.classList.remove('hidden');
            loginWidget.classList.add('visible');
            appState.currentView = 'login';
            setTimeout(() => usernameInput.focus(), 100);
        }

        // Show main application
        async function showMainApplication() {
            loginWidget.classList.remove('visible');
            loginWidget.classList.add('hidden');
            mainWindow.classList.remove('hidden');
            mainWindow.classList.add('visible');
            appState.currentView = 'main';
            
            // Get user ID first
            await getCurrentUserId();
            
            // Populate chat list with data from API
            await populateChatList();
        }

        // Handle registration
        async function handleRegister() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            registerButton.disabled = true;
            loginStatus.textContent = '';
            
            if (!username || !password) {
                loginStatus.textContent = "Please enter both username and password.";
                registerButton.disabled = false;
                return;
            }
            
            loginStatus.textContent = "Registering...";
            
            try {
                const result = await apiCall('/register', {
                    method: 'POST',
                    body: { 
                        username, 
                        password,
                        display_name: username
                    }
                });
                
                if (result.success) {
                    loginStatus.textContent = "Registration successful! You can now login.";
                    loginStatus.style.color = "#4CAF50";
                    
                    // Clear form
                    usernameInput.value = '';
                    passwordInput.value = '';
                } else {
                    loginStatus.textContent = result.message;
                    loginStatus.style.color = "#f44336";
                }
            } catch (error) {
                loginStatus.textContent = "Registration failed. Please try again.";
                loginStatus.style.color = "#f44336";
                console.error('Registration error:', error);
            } finally {
                registerButton.disabled = false;
            }
        }

        // Handle login
        async function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            loginButton.disabled = true;
            loginStatus.textContent = '';
            loginStatus.style.color = "";
            
            if (!username || !password) {
                loginStatus.textContent = "Please enter both username and password.";
                loginButton.disabled = false;
                return;
            }
            
            loginStatus.textContent = "Authenticating...";
            
            try {
                const result = await apiCall('/login', {
                    method: 'POST',
                    body: { username, password }
                });
                
                if (result.success) {
                    loginStatus.textContent = "Login successful!";
                    loginStatus.style.color = "#4CAF50";
                    
                    appState.currentUser = username;
                    appState.currentToken = result.token;
                    profileLabel.textContent = `User: ${username}`;
                    
                    setTimeout(() => {
                        loginWidget.classList.add('fade-out');
                        setTimeout(() => {
                            showMainApplication();
                        }, 500);
                    }, 1000);
                } else {
                    loginStatus.textContent = result.message || "Invalid username or password.";
                    loginStatus.style.color = "#f44336";
                    loginButton.disabled = false;
                }
            } catch (error) {
                loginStatus.textContent = "Login failed. Please check credentials and server.";
                loginStatus.style.color = "#f44336";
                loginButton.disabled = false;
                console.error('Login error:', error);
            }
        }

        // Handle logout
        async function handleLogout() {
            try {
                await apiCall('/logout', { method: 'POST' });
            } catch (error) {
                console.log('Logout API call failed, but proceeding with client-side logout');
            }
            
            // Clear application state
            appState.currentUser = null;
            appState.currentToken = null;
            appState.currentUserId = null;
            appState.currentChatId = null;
            appState.conversations = [];
            appState.messages = {};
            
            // Return to login screen
            mainWindow.classList.remove('visible');
            mainWindow.classList.add('hidden');
            showLoginScreen();
            
            // Clear login form
            usernameInput.value = '';
            passwordInput.value = '';
            loginStatus.textContent = '';
            loginStatus.style.color = "";
        }

        // Show new chat dialog - FIXED: This function was missing
        function showNewChatDialog() {
            console.log("New Chat button clicked!");
            newChatDialog.style.display = 'block';
            toggleGroupFields();
            setTimeout(() => {
                if (groupCheckbox.checked) {
                    chatNameInput.focus();
                } else {
                    participantsInput.focus();
                }
            }, 100);
        }

        // Hide new chat dialog
        function hideNewChatDialog() {
            newChatDialog.style.display = 'none';
            chatNameInput.value = '';
            participantsInput.value = '';
            groupCheckbox.checked = true;
        }

        // Show settings dialog - ADDED: Settings functionality
        function showSettingsDialog() {
            console.log("Settings button clicked!");
            settingsDialog.style.display = 'block';
        }

        // Hide settings dialog
        function hideSettingsDialog() {
            settingsDialog.style.display = 'none';
        }

        // Save settings
        function saveSettings() {
            const theme = themeSelect.value;
            const autoLogin = autoLoginCheckbox.checked;
            
            // Save to localStorage
            localStorage.setItem('theme', theme);
            localStorage.setItem('autoLogin', autoLogin);
            
            alert('Settings saved successfully!');
            hideSettingsDialog();
        }

        // Toggle group chat fields
        function toggleGroupFields() {
            const isGroup = groupCheckbox.checked;
            chatNameRow.style.display = isGroup ? 'block' : 'none';
        }

        // Create new chat
        async function createNewChat() {
            const isGroup = groupCheckbox.checked;
            const chatName = chatNameInput.value.trim();
            const participantsText = participantsInput.value.trim();
            
            if (!participantsText) {
                alert('Please enter at least one participant username.');
                return;
            }
            
            const participants = participantsText.split(',').map(p => p.trim()).filter(p => p);
            
            if (participants.length === 0) {
                alert('Please enter at least one valid participant username.');
                return;
            }
            
            if (isGroup && !chatName) {
                alert('Please enter a chat name for group chats.');
                return;
            }
            
            try {
                const result = await apiCall('/create_conversation', {
                    method: 'POST',
                    body: {
                        user_names: participants,
                        conversation_name: isGroup ? chatName : null,
                        is_group: isGroup
                    }
                });
                
                console.log('Create conversation result:', result);
                
                if (result && result.success) {
                    await populateChatList();
                    hideNewChatDialog();
                    
                    // Select the new chat
                    if (result.message) {
                        setTimeout(() => {
                            const newChatItems = document.querySelectorAll('.chat-list-item');
                            const newChatItem = Array.from(newChatItems).find(item => 
                                item.dataset.id == result.message
                            );
                            if (newChatItem) {
                                newChatItem.click();
                            }
                        }, 500);
                    }
                    
                    alert('Chat created successfully!');
                } else {
                    alert(`Failed to create chat: ${result ? result.message : 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Error creating chat:', error);
                alert(`Failed to create chat: ${error.message}`);
            }
        }

        // Populate chat list with data from API
        async function populateChatList() {
            try {
                const conversations = await apiCall('/get_conversation');
                appState.conversations = Array.isArray(conversations) ? conversations : [];
                
                chatList.innerHTML = '';
                
                if (appState.conversations.length === 0) {
                    chatList.innerHTML = '<div class="chat-list-item">No conversations yet. Click "New Chat" to start!</div>';
                    return;
                }
                
                appState.conversations.forEach(conv => {
                    const item = document.createElement('div');
                    item.className = 'chat-list-item';
                    item.textContent = conv.name || `Chat ${conv.id}`;
                    item.dataset.id = conv.id;
                    
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.chat-list-item').forEach(el => {
                            el.classList.remove('selected');
                        });
                        item.classList.add('selected');
                        loadChat(conv.id);
                    });
                    
                    chatList.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading conversations:', error);
                chatList.innerHTML = '<div class="chat-list-item">Error loading conversations</div>';
            }
        }

        // Load a specific chat
        async function loadChat(chatId) {
            appState.currentChatId = chatId;
            
            const conversation = appState.conversations.find(conv => conv.id === chatId);
            chatHeader.textContent = `Chat: ${conversation ? (conversation.name || `Chat ${chatId}`) : 'Unknown'}`;
            
            chatDisplay.innerHTML = '';
            
            try {
                const result = await apiCall(`/get_messages?conversation_id=${chatId}&limit=50`);
                
                if (result && result.success && result.messages) {
                    result.messages.forEach(msg => {
                        const messageDiv = document.createElement('div');
                        const isOwnMessage = msg.sender_id === appState.currentUserId;
                        messageDiv.className = `message ${isOwnMessage ? 'own-message' : 'other-message'}`;
                        
                        const sender = isOwnMessage ? "You" : `User ${msg.sender_id}`;
                        
                        messageDiv.innerHTML = `
                            <div class="message-sender">${sender}</div>
                            <div class="message-content">${msg.content}</div>
                            <span class="message-time">${msg.timestamp || ''}</span>
                        `;
                        
                        chatDisplay.appendChild(messageDiv);
                    });
                } else {
                    chatDisplay.innerHTML = '<div class="message">No messages yet. Start the conversation!</div>';
                }
            } catch (error) {
                console.error('Error loading messages:', error);
                chatDisplay.innerHTML = '<div class="message">Error loading messages</div>';
            }
            
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            messageInput.disabled = false;
            toggleSendButton();
        }

        // Send a message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !appState.currentChatId) return;
            
            try {
                await apiCall('/send_message', {
                    method: 'POST',
                    body: {
                        conversation_id: appState.currentChatId,
                        content: message
                    }
                });
                
                messageInput.value = '';
                toggleSendButton();
                loadChat(appState.currentChatId);
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message. Please try again.');
            }
        }

        // Toggle send button based on input
        function toggleSendButton() {
            sendButton.disabled = !messageInput.value.trim() || !appState.currentChatId;
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
