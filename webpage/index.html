<div id="settings-dialog" class="hidden">
    <div class="dialog-header">Settings</div>
    <div class="dialog-content">
        
        <div class="group-box">
            <div class="group-title">Profile Settings</div>
            <div class="group-content">
                <div class="form-layout">
                    <div class="form-row">
                        <label for="display-name-settings">Display Name:</label>
                        <input type="text" id="display-name-settings" placeholder="Enter display name">
                    </div>
                    <div class="form-row">
                        <label for="email-settings">Email:</label>
                        <input type="email" id="email-settings" placeholder="Enter email address">
                    </div>
                </div>
            </div>
        </div>

        <div class="group-box">
            <div class="group-title">Change Password</div>
            <div class="group-content">
                <div class="form-layout">
                    <div class="form-row">
                        <label for="old-password-settings">Old Password:</label>
                        <input type="password" id="old-password-settings" placeholder="Enter current password">
                    </div>
                    <div class="form-row">
                        <label for="new-password-settings">New Password:</label>
                        <input type="password" id="new-password-settings" placeholder="Enter new password">
                    </div>
                </div>
            </div>
        </div>

        <div class="group-box">
            <div class="group-title">Appearance</div>
            <div class="group-content">
                <div class="checkbox-row">
                    <input type="checkbox" id="dark-mode-settings" checked>
                    <label for="dark-mode-settings">Enable Dark Mode</label>
                </div>
            </div>
        </div>

        <div id="settings-status-message" class="status-message"></div>

        <div class="button-row">
            <button class="settings-button cancel" id="cancel-settings-button">Cancel</button>
            <button class="settings-button save" id="save-settings-button">Save Changes</button>
        </div>
    </div>
</div>
