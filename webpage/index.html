<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherLink Messenger</title>
    <style>
        /* Dark theme palette (default) */
        :root {
            --background: #121212;
            --primary-text: #EAEAEA;
            --secondary-text: #9E9E9E;
            --ui-borders: #2A2A2A;
            --accent: #BB86FC;
            --shadow: rgba(0,0,0,0.20);
            --chat-bg: #571452;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--primary-text);
            font-size: 14px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Loading Widget Styles */
        #loading-widget {
            width: 450px;
            min-height: 200px;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.5s ease;
        }

        #loading-label {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
        }

        #loading-progress {
            width: 100%;
            height: 24px;
            border: 1px solid var(--ui-borders);
            border-radius: 5px;
            overflow: hidden;
            background-color: var(--background);
        }

        #loading-progress-bar {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.1s ease;
        }

        /* Login Widget Styles */
        #login-widget {
            width: 400px;
            min-height: 320px;
            padding: 30px 40px;
            display: none;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.5s ease;
        }

        .login-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-row label {
            text-align: right;
            width: 30%;
            color: var(--primary-text);
        }

        .form-row input {
            width: 70%;
            background-color: var(--background);
            border: 1.5px solid var(--ui-borders);
            border-radius: 6px;
            padding: 10px;
            font-size: 15px;
            color: var(--primary-text);
        }

        .login-button, .register-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 10px 20px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-button:hover, .register-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        .login-button:active, .register-button:active {
            background-color: var(--accent);
            color: white;
        }

        .login-button {
            height: 40px;
        }

        .register-button {
            height: 30px;
        }

        #login-status {
            text-align: center;
            min-height: 20px;
            color: var(--accent);
        }

        /* Main Window Styles */
        #main-window {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: row;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 200px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--background);
            border-right: 1px solid var(--ui-borders);
        }

        #profile-label {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid var(--ui-borders);
        }

        #sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        /* Splitter Layout */
        #splitter {
            display: flex;
            flex: 1;
            height: 100%;
        }

        /* Chat List Styles */
        #chat-list {
            width: 280px;
            max-width: 280px;
            border-right: 1px solid var(--ui-borders);
            background-color: var(--background);
            color: var(--primary-text);
            overflow-y: auto;
        }

        .chat-list-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--ui-borders);
            transition: background-color 0.2s;
        }

        .chat-list-item:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }

        .chat-list-item.selected {
            background-color: var(--accent);
            color: white;
        }

        /* Chat Area Styles */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        #chat-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--ui-borders);
        }

        #chat-display {
            flex: 1;
            background-color: var(--chat-bg);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-sender {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message-time {
            color: #888;
            font-size: 10px;
            margin-left: 5px;
            float: right;
        }

        .message-content {
            margin-top: 4px;
        }

        .own-message {
            align-self: flex-end;
            background-color: rgba(41, 121, 255, 0.2);
            border: 1px solid rgba(41, 121, 255, 0.5);
        }

        .other-message {
            align-self: flex-start;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.3);
        }

        #input-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #message-input {
            flex: 1;
            background-color: var(--background);
            border: 1.5px solid var(--ui-borders);
            border-radius: 6px;
            padding: 12px;
            font-size: 15px;
            color: var(--primary-text);
        }

        #send-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 12px 24px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        #send-button:hover:not(:disabled) {
            background-color: var(--primary-text);
            color: var(--background);
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* New Chat Dialog Styles */
        #new-chat-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 20px;
            background-color: var(--background);
            border: 1px solid var(--ui-borders);
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .dialog-row {
            margin-bottom: 15px;
        }

        .dialog-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .dialog-button {
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .dialog-button:hover {
            background-color: var(--primary-text);
            color: var(--background);
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }

        .visible {
            display: flex !important;
        }

        .block-visible {
            display: block !important;
        }

        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- Loading Widget -->
    <div id="loading-widget" class="visible">
        <div id="loading-label">Connecting to server...</div>
        <div id="loading-progress">
            <div id="loading-progress-bar"></div>
        </div>
    </div>

    <!-- Login Widget -->
    <div id="login-widget" class="hidden">
        <div class="login-title">WELCOME BACK</div>
        <div class="form-row">
            <label for="username-input">Username:</label>
            <input type="text" id="username-input" placeholder="Enter Your Username/Email">
        </div>
        <div class="form-row">
            <label for="password-input">Password:</label>
            <input type="password" id="password-input" placeholder="Enter Your Password">
        </div>
        <button id="login-button" class="login-button">Login</button>
        <button id="register-button" class="register-button">Register</button>
        <div id="login-status"></div>
    </div>

    <!-- Main Window -->
    <div id="main-window" class="hidden">
        <!-- Sidebar -->
        <div id="sidebar">
            <div id="profile-label">User: placeholder</div>
            <div id="sidebar-buttons">
                <button id="new-chat-button" class="sidebar-button">New Chat</button>
                <button id="settings-button" class="sidebar-button">Settings</button>
            </div>
        </div>

        <!-- Splitter -->
        <div id="splitter">
            <!-- Chat List -->
            <div id="chat-list"></div>

            <!-- Chat Area -->
            <div id="chat-area">
                <div id="chat-header">Select a chat</div>
                <div id="chat-display"></div>
                <div id="input-area">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button id="send-button" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Dialog -->
    <div id="new-chat-dialog" class="hidden">
        <div class="dialog-row">
            <input type="checkbox" id="group-checkbox" checked>
            <label for="group-checkbox">Group Chat</label>
        </div>
        <div class="dialog-row" id="chat-name-row">
            <label for="chat-name-input">Chat Name:</label>
            <input type="text" id="chat-name-input">
        </div>
        <div class="dialog-row">
            <label for="participants-input">Usernames (comma separated):</label>
            <input type="text" id="participants-input">
        </div>
        <div class="dialog-buttons">
            <button id="confirm-button" class="dialog-button">Confirm</button>
            <button id="cancel-button" class="dialog-button">Cancel</button>
        </div>
    </div>

    <script>
        // Application state
        const appState = {
            currentView: 'loading',
            currentUser: null,
            currentChatId: null,
            conversations: [],
            messages: {},
            loadingSteps: [
                "Connecting to server...",
                "Loading user data...",
                "Preparing interface...",
                "Finalizing setup...",
                "Done!"
            ],
            currentStep: 0,
            progressValue: 0
        };

        // DOM Elements
        const loadingWidget = document.getElementById('loading-widget');
        const loginWidget = document.getElementById('login-widget');
        const mainWindow = document.getElementById('main-window');
        const newChatDialog = document.getElementById('new-chat-dialog');

        // Loading Widget Elements
        const loadingLabel = document.getElementById('loading-label');
        const loadingProgressBar = document.getElementById('loading-progress-bar');

        // Login Widget Elements
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const loginButton = document.getElementById('login-button');
        const registerButton = document.getElementById('register-button');
        const loginStatus = document.getElementById('login-status');

        // Main Window Elements
        const profileLabel = document.getElementById('profile-label');
        const chatList = document.getElementById('chat-list');
        const chatHeader = document.getElementById('chat-header');
        const chatDisplay = document.getElementById('chat-display');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const newChatButton = document.getElementById('new-chat-button');

        // New Chat Dialog Elements
        const groupCheckbox = document.getElementById('group-checkbox');
        const chatNameRow = document.getElementById('chat-name-row');
        const chatNameInput = document.getElementById('chat-name-input');
        const participantsInput = document.getElementById('participants-input');
        const confirmButton = document.getElementById('confirm-button');
        const cancelButton = document.getElementById('cancel-button');

        // Initialize the application
        function init() {
            // Set up event listeners
            setupEventListeners();
            
            // Start with loading screen
            simulateLoading();
        }

        // Set up all event listeners
        function setupEventListeners() {
            // Login form
            loginButton.addEventListener('click', handleLogin);
            registerButton.addEventListener('click', handleRegister);
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            // Main window
            newChatButton.addEventListener('click', showNewChatDialog);
            messageInput.addEventListener('input', toggleSendButton);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            sendButton.addEventListener('click', sendMessage);

            // New chat dialog
            groupCheckbox.addEventListener('change', toggleGroupFields);
            confirmButton.addEventListener('click', createNewChat);
            cancelButton.addEventListener('click', hideNewChatDialog);
        }

        // Simulate loading process
        function simulateLoading() {
            const totalSteps = appState.loadingSteps.length;
            const progressInterval = setInterval(() => {
                appState.progressValue += 1;
                loadingProgressBar.style.width = `${(appState.progressValue / (totalSteps * 20)) * 100}%`;
                
                const stepIndex = Math.floor(appState.progressValue / 20);
                if (stepIndex >= totalSteps) {
                    clearInterval(progressInterval);
                    loadingLabel.textContent = "Loading complete!";
                    
                    // Fade out loading screen and show login
                    setTimeout(() => {
                        loadingWidget.classList.add('fade-out');
                        setTimeout(() => {
                            loadingWidget.classList.remove('visible');
                            loadingWidget.classList.add('hidden');
                            showLoginScreen();
                        }, 500);
                    }, 1000);
                    return;
                }
                
                if (stepIndex !== appState.currentStep) {
                    appState.currentStep = stepIndex;
                    loadingLabel.textContent = appState.loadingSteps[appState.currentStep];
                }
            }, 100);
        }

        // Show login screen
        function showLoginScreen() {
            loginWidget.classList.remove('hidden');
            loginWidget.classList.add('visible');
            appState.currentView = 'login';
            
            // Focus on username input
            setTimeout(() => {
                usernameInput.focus();
            }, 100);
        }

        // Show main application
        function showMainApplication() {
            loginWidget.classList.remove('visible');
            loginWidget.classList.add('hidden');
            mainWindow.classList.remove('hidden');
            mainWindow.classList.add('visible');
            appState.currentView = 'main';
            
            // Populate chat list with sample data
            populateChatList();
        }

        // Handle login
        function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            loginButton.disabled = true;
            loginStatus.textContent = '';
            
            if (!username || !password) {
                loginStatus.textContent = "Please enter both username and password.";
                loginButton.disabled = false;
                return;
            }
            
            // Simulate authentication
            loginStatus.textContent = "Authenticating...";
            
            // Simulate API call delay
            setTimeout(() => {
                // For demo purposes, accept any non-empty credentials
                if (username && password) {
                    loginStatus.textContent = "Login successful!";
                    appState.currentUser = username;
                    profileLabel.textContent = `User: ${username}`;
                    
                    // Transition to main application
                    setTimeout(() => {
                        loginWidget.classList.add('fade-out');
                        setTimeout(() => {
                            showMainApplication();
                        }, 500);
                    }, 1000);
                } else {
                    loginStatus.textContent = "Invalid credentials. Please try again.";
                    loginButton.disabled = false;
                }
            }, 1000);
        }

        // Handle registration
        function handleRegister() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            registerButton.disabled = true;
            loginStatus.textContent = '';
            
            if (!username || !password) {
                loginStatus.textContent = "Please enter both username and password.";
                registerButton.disabled = false;
                return;
            }
            
            // Simulate registration
            loginStatus.textContent = "Registering...";
            
            // Simulate API call delay
            setTimeout(() => {
                loginStatus.textContent = "Registration successful! Please log in.";
                registerButton.disabled = false;
            }, 1000);
        }

        // Populate chat list with sample data
        function populateChatList() {
            // Sample conversation data
            appState.conversations = [
                { id: 1, name: "General Chat", isGroup: true },
                { id: 2, name: "John Doe", isGroup: false },
                { id: 3, name: "Project Team", isGroup: true },
                { id: 4, name: "Alice Smith", isGroup: false },
                { id: 5, name: "Family Group", isGroup: true }
            ];
            
            // Clear existing list
            chatList.innerHTML = '';
            
            // Add conversations to list
            appState.conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'chat-list-item';
                item.textContent = conv.name;
                item.dataset.id = conv.id;
                
                item.addEventListener('click', () => {
                    // Remove selected class from all items
                    document.querySelectorAll('.chat-list-item').forEach(el => {
                        el.classList.remove('selected');
                    });
                    
                    // Add selected class to clicked item
                    item.classList.add('selected');
                    
                    // Load the chat
                    loadChat(conv.id);
                });
                
                chatList.appendChild(item);
            });
            
            // Sample messages for each conversation
            appState.messages = {
                1: [
                    { sender_id: 2, content: "Hello everyone!", timestamp: "10:30 AM" },
                    { sender_id: 3, content: "Hi there!", timestamp: "10:31 AM" },
                    { sender_id: 1, content: "Good morning! How is everyone doing today?", timestamp: "10:32 AM" },
                    { sender_id: 4, content: "I'm doing great, thanks for asking!", timestamp: "10:33 AM" }
                ],
                2: [
                    { sender_id: 2, content: "Hey, how are you?", timestamp: "09:15 AM" },
                    { sender_id: 1, content: "I'm good, thanks! How about you?", timestamp: "09:16 AM" },
                    { sender_id: 2, content: "Pretty good. Did you finish that project we were discussing?", timestamp: "09:17 AM" },
                    { sender_id: 1, content: "Yes, I sent it over last night. Let me know if you need any changes.", timestamp: "09:18 AM" }
                ],
                3: [
                    { sender_id: 4, content: "Let's discuss the project timeline", timestamp: "Yesterday" },
                    { sender_id: 1, content: "I'll prepare the presentation", timestamp: "Yesterday" },
                    { sender_id: 5, content: "I've completed the backend API. Ready for integration.", timestamp: "10:00 AM" },
                    { sender_id: 1, content: "Great! I'll start integrating it today.", timestamp: "10:05 AM" }
                ],
                4: [
                    { sender_id: 4, content: "Hi! Are we still meeting tomorrow?", timestamp: "2:30 PM" },
                    { sender_id: 1, content: "Yes, 3 PM at the usual place.", timestamp: "2:32 PM" }
                ],
                5: [
                    { sender_id: 6, content: "Don't forget about mom's birthday this weekend!", timestamp: "Yesterday" },
                    { sender_id: 7, content: "I'll bring the cake", timestamp: "Yesterday" },
                    { sender_id: 1, content: "I've ordered the gift already.", timestamp: "Today" }
                ]
            };
        }

        // Load a specific chat
        function loadChat(chatId) {
            appState.currentChatId = chatId;
            
            // Find conversation name for header
            const conversation = appState.conversations.find(conv => conv.id === chatId);
            chatHeader.textContent = `Chat: ${conversation.name}`;
            
            // Clear chat display
            chatDisplay.innerHTML = '';
            
            // Add messages to chat display
            if (appState.messages[chatId]) {
                appState.messages[chatId].forEach(msg => {
                    const messageDiv = document.createElement('div');
                    const isOwnMessage = msg.sender_id === 1;
                    messageDiv.className = `message ${isOwnMessage ? 'own-message' : 'other-message'}`;
                    
                    const sender = isOwnMessage ? "You" : `User ${msg.sender_id}`;
                    
                    messageDiv.innerHTML = `
                        <div class="message-sender">${sender}</div>
                        <div class="message-content">${msg.content}</div>
                        <span class="message-time">${msg.timestamp}</span>
                    `;
                    
                    chatDisplay.appendChild(messageDiv);
                });
            }
            
            // Scroll to bottom of chat
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            
            // Enable message input
            messageInput.disabled = false;
            toggleSendButton();
        }

        // Send a message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !appState.currentChatId) return;
            
            // Create new message object
            const newMessage = {
                sender_id: 1, // Current user ID
                content: message,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            
            // Add to messages
            if (!appState.messages[appState.currentChatId]) {
                appState.messages[appState.currentChatId] = [];
            }
            appState.messages[appState.currentChatId].push(newMessage);
            
            // Clear input
            messageInput.value = '';
            toggleSendButton();
            
            // Reload chat to show new message
            loadChat(appState.currentChatId);
        }

        // Toggle send button based on input
        function toggleSendButton() {
            sendButton.disabled = !messageInput.value.trim() || !appState.currentChatId;
        }

        // Show new chat dialog
        function showNewChatDialog() {
            newChatDialog.style.display = 'block';
            toggleGroupFields(); // Set initial state
        }

        // Hide new chat dialog
        function hideNewChatDialog() {
            newChatDialog.style.display = 'none';
            // Reset form
            chatNameInput.value = '';
            participantsInput.value = '';
            groupCheckbox.checked = true;
        }

        // Toggle group chat fields
        function toggleGroupFields() {
            const isGroup = groupCheckbox.checked;
            chatNameRow.style.display = isGroup ? 'block' : 'none';
        }

        // Create new chat
        function createNewChat() {
            const isGroup = groupCheckbox.checked;
            const chatName = chatNameInput.value;
            const participants = participantsInput.value.split(',').map(p => p.trim()).filter(p => p);
            
            console.log(`Creating conversation: group=${isGroup}, name=${chatName}, users=${participants}`);
            
            // Create new conversation
            const newConv = {
                id: Math.max(...appState.conversations.map(c => c.id)) + 1,
                name: isGroup ? (chatName || 'New Group Chat') : participants[0] || 'New Chat',
                isGroup: isGroup
            };
            
            appState.conversations.push(newConv);
            
            // Initialize empty messages for new chat
            appState.messages[newConv.id] = [];
            
            // Update chat list
            populateChatList();
            
            // Close dialog
            hideNewChatDialog();
            
            // Select the new chat
            setTimeout(() => {
                const newChatItem = document.querySelector(`.chat-list-item[data-id="${newConv.id}"]`);
                if (newChatItem) {
                    newChatItem.click();
                }
            }, 100);
        }

        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
