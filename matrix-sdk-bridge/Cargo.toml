[package]
name = "matrix-sdk-bridge"
version = "0.1.0"
edition = "2024"
description = "WebAssembly Matrix SDK bridge for Vigilant"
license = "MIT"

# To compile this as a dynamic WebAssembly library
[lib]
crate-type = ["cdylib"] 

[dependencies]
async-lock = "3.4.2"
js-sys = "0.3.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["console"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
mime = "0.3.17"

[dependencies.matrix-sdk]
version = "0.18.0"
default-features = false
features = [
    "js",         # Required for WASM targets (handles system time in JS)
    "indexeddb",  # Automatically persists sessions in the browser
    "e2e-encryption",
]

[dependencies.matrix-sdk-ui]
version = "0.18.0"
default-features = false
